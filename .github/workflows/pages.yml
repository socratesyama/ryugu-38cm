name: site
on:
  workflow_dispatch:
  push:
    branches: [main, claude/ryugu-38cm-site]   # サイトコードはこのブランチにのみ存在するため
    paths: ['site/**', 'tools/**', 'scripts/**', '12_site_data/**']
permissions: { contents: read, pages: write, id-token: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install numpy pillow
      - name: Scientific validation — TD1 shape intersections
        run: python -m unittest discover -s 12_site_data/tests -v
      - name: Time conversion regression tests
        run: python -m unittest discover -s tools/precompute/tests -v
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: bash tools/precompute/run_all.sh
      - run: cd site && npm install && npm run build
      - name: Site logic tests (features, thermal)
        run: cd site && npm run test:features && npm run test:thermal
      - name: Size gate — Cloudflare Pages 25 MiB/file limit
        run: python3 09_manifests/tools/check_large_files.py --root site/dist
      - uses: actions/upload-pages-artifact@v3
        with: { path: site/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
